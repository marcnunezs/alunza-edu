<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Invitación a Alunza</title>
  </head>
  <body>
    <h1>Te invitaron a Alunza</h1>
    <p>
      Continúa para verificar tu correo y aceptar la invitación institucional.
    </p>
    <p>
      <a
        href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=invite"
        >Continuar en Alunza</a
      >
    </p>
    <p>
      La invitación institucional vence en 72 horas. Si recibiste otro correo
      después de este, usa el enlace más reciente.
    </p>
    <p>Si no esperabas esta invitación, puedes ignorar este mensaje.</p>
  </body>
</html>
